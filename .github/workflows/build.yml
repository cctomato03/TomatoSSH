name: build

# Windows / macOS / Linux 三个平台各自在自己的系统上打包。
# - 推送 tag（v1.1.0）→ 编译 + 创建 **已发布** Release（可直接下载安装包）
# - 手动 Run workflow     → 只编译并上传 Actions Artifacts（不建 Release）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 创建 Release / 上传资产需要写权限，缺了会报
#   Error: Resource not accessible by integration (create-a-release)
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos-arm64
            args: "--target aarch64-apple-darwin --bundles dmg app"
          - platform: macos-latest
            label: macos-x64
            args: "--target x86_64-apple-darwin --bundles dmg app"
          - platform: ubuntu-22.04
            label: linux-x64
            args: "--bundles deb appimage"
          - platform: windows-latest
            label: windows-x64
            args: "--bundles msi nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # 版本号跟 git tag 走：tag v1.2.1 → 应用/安装包版本 1.2.1
      - name: 版本号对齐 git tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "本次构建版本: $VERSION"
          node scripts/set-version.mjs "$VERSION"

      # Ubuntu 下 Tauri 需要的系统依赖（22.04 用 ayatana 版 appindicator）
      - name: 安装 Linux 打包依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential curl wget file libssl-dev

      # 注意：不要在这里写 version，否则会与 package.json 的 "packageManager" 冲突，
      # pnpm/action-setup 会报 "Multiple versions of pnpm specified" 并秒失败。
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # macOS 需要额外装目标，才能分别产出 Intel / Apple Silicon 包
      - name: 追加 macOS 编译目标
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # tag 触发：编译 + 建 Release + 上传资产（tauri-action 一步完成）
      - name: 打包并发布 Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TomatoSSH ${{ github.ref_name }}"
          releaseBody: "安装包：Windows 用 .msi 或 -setup.exe；macOS 用 .dmg；Linux 用 .deb / .AppImage。详见 README。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 手动触发：只编译
      - name: 仅打包（手动触发时）
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: pnpm tauri build ${{ matrix.args }}

      # 无论 Release 是否成功，都把安装包留成 Artifacts，避免白跑一遍
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomatossh-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: warn
          overwrite: true
