name: build

# Windows / macOS / Linux 三个平台各自在自己的系统上打包。
# - 推送 tag（v1.0.0）→ 自动创建 Draft Release 并上传安装包
# - 手动 Run workflow     → 只把安装包上传为 Actions Artifacts
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos-arm64
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            label: macos-x64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            label: linux-x64
            args: ""
          - platform: windows-latest
            label: windows-x64
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Ubuntu 下 Tauri 需要的系统依赖（22.04 用 ayatana 版 appindicator）
      - name: 安装 Linux 打包依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential curl wget file libssl-dev

      # 注意：不要同时在这里写 version，否则会与 package.json 的 "packageManager" 冲突
      # 报错：Multiple versions of pnpm specified ... 直接失败。
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # macOS 需要额外装两个目标，才能交叉出 Intel / Apple Silicon 两种包
      - name: 追加 macOS 编译目标
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 打包并发布 Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TomatoSSH ${{ github.ref_name }}"
          releaseBody: "安装包：Windows 用 .msi 或 -setup.exe；macOS 用 .dmg；Linux 用 .deb / .AppImage。详见 README。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: 仅打包（手动触发时）
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: pnpm tauri build ${{ matrix.args }}

      - name: 上传构建产物（手动触发时）
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: tomatossh-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: warn
