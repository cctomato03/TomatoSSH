[package]
name = "tomatossh-verify"
version = "0.1.0"
edition = "2021"
description = "在缺少 Tauri 构建环境时，对 TomatoSSH 后端逻辑做静态编译校验（复用真实源码文件）"

[lib]
path = "src/lib.rs"

[dependencies]
tauri = { path = "../shim-tauri", package = "tauri" }
tauri-plugin-dialog = { path = "../shim-tauri-plugin-dialog", package = "tauri-plugin-dialog" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
portable-pty = "0.9"
serialport = "4"

aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"

dirs = "6"
filetime = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[workspace]
